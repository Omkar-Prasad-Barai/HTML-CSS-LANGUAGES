<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image with Caption</title>
  <style>
    figure {
      text-align: center;
    }

    figcaption {
      font-style: italic;
      color: gray;
    }
  </style>
</head>
<body>
  <figure>
    <img src="https://via.placeholder.com/300" alt="Placeholder Image">
    <figcaption>Placeholder Image Caption</figcaption>
  </figure>
</body>
</html>
