<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Table</title>
  <style>
    .pricing {
      border: 1px solid #ccc;
      border-radius: 10px;
      width: 250px;
      text-align: center;
      margin: 20px auto;
      padding: 15px;
    }
    .pricing h2 {
      margin-bottom: 10px;
    }
    .pricing p {
      font-size: 14px;
      color: gray;
      margin: 10px 0;
    }
    .pricing button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
    .pricing button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="pricing">
    <h2>Basic Plan</h2>
    <p>$10/month</p>
    <button>Subscribe</button>
  </div>
</body>
</html>
