<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature List</title>
  <style>
    .features {
      font-family: Arial, sans-serif;
      margin: 20px auto;
      max-width: 600px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .features ul {
      list-style: none;
      padding: 0;
    }
    .features li {
      background: #f4f4f4;
      margin: 5px 0;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="features">
    <h2>Key Features</h2>
    <ul>
      <li>Responsive Design</li>
      <li>Cross-Browser Compatibility</li>
      <li>Easy to Customize</li>
    </ul>
  </div>
</body>
</html>
