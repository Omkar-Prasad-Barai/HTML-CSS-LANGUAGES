<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image with Caption</title>
  <style>
    .image-container {
      text-align: center;
      margin: 20px 0;
    }
    .image-container img {
      max-width: 100%;
      height: auto;
    }
    .image-container p {
      margin-top: 10px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="image-container">
    <img src="https://via.placeholder.com/600x300" alt="Sample Image">
    <p>Sample caption for the image</p>
  </div>
</body>
</html>
