<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post</title>
  <style>
    .blog-post {
      max-width: 700px;
      margin: 20px auto;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background-color: #f9f9f9;
      font-family: Arial, sans-serif;
    }
    .blog-post h2 {
      margin-bottom: 10px;
    }
    .blog-post p {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="blog-post">
    <h2>How to Learn HTML & CSS</h2>
    <p>HTML and CSS are the building blocks of the web. To get started, focus on creating small projects and practicing regularly.</p>
  </div>
</body>
</html>
