<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visibility and Display</title>
  <style>
    .hidden-box {
      display: none;
    }

    .visible-box {
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div class="hidden-box">This box is hidden using display: none;</div>
  <div class="visible-box">This box is hidden using visibility: hidden;</div>
</body>
</html>
