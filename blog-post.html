<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post</title>
  <style>
    .blog-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      width: 300px;
      padding: 15px;
      margin: 20px auto;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .blog-card img {
      width: 50%;
      border-radius: 10px;
    }
    .blog-card h2 {
      font-size: 18px;
      margin: 10px 0;
    }
    .blog-card p {
      font-size: 14px;
      color: gray;
    }
  </style>
</head>
<body>
  <div class="blog-card">
    <img src="https://via.placeholder.com/300x150" alt="Blog Image">
    <h2>How to Learn HTML & CSS</h2>
    <p>A step-by-step guide for beginners</p>
  </div>
</body>
</html>
