<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Styling</title>
  <style>
    button {
      background-color: blue;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
    }

    button:hover {
      background-color: darkblue;
    }
  </style>
</head>
<body>
  <button>Click Me</button>
</body>
</html>
