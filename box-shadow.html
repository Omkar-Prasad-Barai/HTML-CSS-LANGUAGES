<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Shadow</title>
  <style>
    .card {
      box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
      padding: 20px;
      background-color: white;
    }
  </style>
</head>
<body>
  <div class="card">This is a card with a shadow.</div>
</body>
</html>
