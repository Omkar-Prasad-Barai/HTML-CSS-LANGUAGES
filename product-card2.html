<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <style>
    .card {
      border: 1px solid #ccc;
      border-radius: 10px;
      width: 250px;
      padding: 15px;
      text-align: center;
      margin: 20px auto;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .card img {
      width: 100%;
      border-radius: 10px;
    }
    .card h2 {
      font-size: 18px;
      margin: 10px 0;
    }
    .card p {
      font-size: 14px;
      color: #555;
    }
    .card button {
      padding: 10px 15px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .card button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://via.placeholder.com/250x150" alt="Product Image">
    <h2>Product Name</h2>
    <p>$25.00</p>
    <button>Add to Cart</button>
  </div>
</body>
</html>
