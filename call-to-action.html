<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call to Action</title>
  <style>
    .cta {
      text-align: center;
      padding: 40px;
      background-color: #007bff;
      color: white;
      font-family: Arial, sans-serif;
    }
    .cta h1 {
      margin-bottom: 20px;
    }
    .cta button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #0056b3;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .cta button:hover {
      background-color: #003f8c;
    }
  </style>
</head>
<body>
  <div class="cta">
    <h1>Join Us Today!</h1>
    <p>Sign up for exclusive benefits and updates.</p>
    <button>Get Started</button>
  </div>
</body>
</html>
