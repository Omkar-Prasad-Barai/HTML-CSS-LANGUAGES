<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-Index</title>
  <style>
    .box1 {
      position: relative;
      z-index: 10;
      background-color: red;
      width: 100px;
      height: 100px;
    }

    .box2 {
      position: relative;
      z-index: 5;
      background-color: blue;
      width: 100px;
      height: 100px;
      margin-top: -50px;
    }
  </style>
</head>
<body>
  <div class="box1"></div>
  <div class="box2"></div>
</body>
</html>
