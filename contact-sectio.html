<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Section</title>
  <style>
    .contact-section {
      background-color: #f4f4f4;
      padding: 20px;
      width: 300px;
      margin: 20px auto;
      border-radius: 10px;
      text-align: center;
    }
    .contact-section h3 {
      margin-bottom: 15px;
    }
    .contact-section a {
      display: block;
      color: #007bff;
      text-decoration: none;
      margin: 5px 0;
    }
    .contact-section a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="contact-section">
    <h3>Contact Us</h3>
    <a href="tel:+123456789">Call: +123456789</a>
    <a href="mailto:info@example.com">Email: info@example.com</a>
  </div>
</body>
</html>
