<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Cursor</title>
  <style>
    body {
      cursor: pointer;
    }

    .custom {
      cursor: crosshair;
      padding: 20px;
      background-color: lightyellow;
      text-align: center;
      border: 1px solid gray;
    }
  </style>
</head>
<body>
  <div class="custom">Hover over this box to see a custom cursor!</div>
</body>
</html>
