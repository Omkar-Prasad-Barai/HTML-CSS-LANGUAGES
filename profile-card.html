<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <style>
    .profile {
      border: 1px solid #ddd;
      border-radius: 10px;
      width: 200px;
      text-align: center;
      padding: 15px;
      margin: 20px auto;
    }
    .profile img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 10px;
    }
    .profile h3 {
      margin: 10px 0;
    }
    .profile p {
      color: gray;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="profile">
    <img src="https://via.placeholder.com/100" alt="Profile Picture">
    <h3>John Doe</h3>
    <p>Web Developer</p>
  </div>
</body>
</html>
