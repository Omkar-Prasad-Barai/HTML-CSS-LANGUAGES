<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Section</title>
  <style>
    .team {
      text-align: center;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .team h2 {
      margin-bottom: 20px;
    }
    .team-members {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .member {
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      max-width: 200px;
      text-align: center;
      background-color: #fff;
    }
    .member img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="team">
    <h2>Our Team</h2>
    <div class="team-members">
      <div class="member">
        <img src="https://via.placeholder.com/80" alt="Team Member">
        <h3>John</h3>
        <p>Designer</p>
      </div>
      <div class="member">
        <img src="https://via.placeholder.com/80" alt="Team Member">
        <h3>Lisa</h3>
        <p>Developer</p>
      </div>
      <div class="member">
        <img src="https://via.placeholder.com/80" alt="Team Member">
        <h3>Mark</h3>
        <p>Manager</p>
      </div>
    </div>
  </div>
</body>
</html>
