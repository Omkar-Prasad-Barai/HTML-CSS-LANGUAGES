<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Table</title>
  <style>
    .pricing-table {
      width: 90%;
      max-width: 800px;
      margin: 20px auto;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
    }
    .pricing-table th, .pricing-table td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    .pricing-table th {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>
  <table class="pricing-table">
    <thead>
      <tr>
        <th>Plan</th>
        <th>Price</th>
        <th>Features</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Basic</td>
        <td>$10/month</td>
        <td>1 User, 5GB Storage</td>
      </tr>
      <tr>
        <td>Pro</td>
        <td>$20/month</td>
        <td>5 Users, 50GB Storage</td>
      </tr>
      <tr>
        <td>Enterprise</td>
        <td>$50/month</td>
        <td>Unlimited Users, 1TB Storage</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
