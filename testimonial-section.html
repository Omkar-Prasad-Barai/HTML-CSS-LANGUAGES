<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonial Section</title>
  <style>
    .testimonials {
      text-align: center;
      padding: 20px;
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    }
    .testimonial {
      margin: 15px auto;
      width: 80%;
      max-width: 500px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: white;
    }
    .testimonial p {
      font-style: italic;
    }
    .testimonial h3 {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="testimonials">
    <div class="testimonial">
      <p>"This website is amazing! Highly recommended."</p>
      <h3>- Jane Doe</h3>
    </div>
    <div class="testimonial">
      <p>"Fantastic service and support. 5 stars!"</p>
      <h3>- John Smith</h3>
    </div>
  </div>
</body>
</html>
