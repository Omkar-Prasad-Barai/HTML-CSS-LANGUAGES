<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Card</title>
  <style>
    .event-card {
      width: 90%;
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      background-color: #fefefe;
    }
    .event-card h3 {
      margin: 0;
      color: #333;
    }
    .event-card p {
      margin: 5px 0;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="event-card">
    <h3>Music Concert</h3>
    <p>Date: March 15, 2025</p>
    <p>Time: 7:00 PM</p>
    <p>Location: City Auditorium</p>
  </div>
</body>
</html>
